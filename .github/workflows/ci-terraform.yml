name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

        # Automatically format Terraform files
      - name: Terraform Format
        run: |
          echo "Formatting all Terraform files..."
          terraform fmt -recursive

      # Optional: Check formatting (will now always pass)
      - name: Terraform Format Check
        run: |
          echo "Verifying Terraform formatting..."
          terraform fmt -check -recursive
          
      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan -input=false

      - name: Terraform Apply (main branch only)
        if: github.ref == 'refs/heads/main'
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan
